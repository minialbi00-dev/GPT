<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <title>Logo Emblem Krom 3D Tiga Not Musik</title>

  <defs>
    
    <filter id="drop-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="4" dy="7" stdDeviation="6" flood-color="#0b0d10" flood-opacity="0.45" />
    </filter>

    
    <linearGradient id="chrome-outer" x1="12%" y1="10%" x2="88%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="16%" stop-color="#d4d9df" />
      <stop offset="34%" stop-color="#4e555e" />
      <stop offset="48%" stop-color="#1e2226" />
      <stop offset="53%" stop-color="#9aa2ac" />
      <stop offset="68%" stop-color="#ffffff" />
      <stop offset="84%" stop-color="#5c646e" />
      <stop offset="100%" stop-color="#e6eaef" />
    </linearGradient>

    
    <linearGradient id="chrome-inner" x1="88%" y1="90%" x2="12%" y2="10%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#6e7680" />
      <stop offset="50%" stop-color="#22262b" />
      <stop offset="75%" stop-color="#e3e7ec" />
      <stop offset="100%" stop-color="#495059" />
    </linearGradient>

    
    <linearGradient id="chrome-metal" gradientUnits="userSpaceOnUse" x1="90" y1="80" x2="410" y2="420">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#dce1e7" />
      <stop offset="36%" stop-color="#525963" />
      <stop offset="47%" stop-color="#1c2024" />
      <stop offset="52%" stop-color="#b4bcc6" />
      <stop offset="66%" stop-color="#ffffff" />
      <stop offset="82%" stop-color="#4a515a" />
      <stop offset="100%" stop-color="#cfd5dc" />
    </linearGradient>

    
    <linearGradient id="chrome-rim" gradientUnits="userSpaceOnUse" x1="80" y1="80" x2="420" y2="420">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#8b939e" />
      <stop offset="55%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#3a4048" />
    </linearGradient>

    
    <path id="note-shape" d="
      M 246.5 294.5
      L 247.5 74
      C 247.5 68, 257 68, 260 76
      C 272 104, 306 116, 302 154
      C 300 172, 290 186, 279 194
      C 286 178, 290 162, 288 146
      C 285 126, 271 114, 259.5 108
      L 259.1 308.3
      C 259.1 334.8, 208.9 348.2, 208.9 321.7
      C 208.9 303.5, 229 292.5, 246.5 294.5 Z" />

    
    <g id="all-notes">
      <use href="#note-shape" />
      <use href="#note-shape" transform="rotate(120 250 250)" />
      <use href="#note-shape" transform="rotate(240 250 250)" />
    </g>
  </defs>

  
  <g filter="url(#drop-shadow)">
    
    
    <circle cx="252" cy="253" r="216" fill="none" stroke="#181b1f" stroke-width="20" />
    
    <circle cx="250" cy="250" r="216" fill="none" stroke="url(#chrome-outer)" stroke-width="20" />
    
    <circle cx="250" cy="250" r="226" fill="none" stroke="#363c44" stroke-width="1.2" />
    <circle cx="250" cy="250" r="224.5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.75" />

    
    <circle cx="251.5" cy="252" r="196" fill="none" stroke="#181b1f" stroke-width="5" />
    
    <circle cx="250" cy="250" r="196" fill="none" stroke="url(#chrome-inner)" stroke-width="5" />

    
    <use href="#all-notes" transform="translate(2.5, 3.5)" fill="#181b1f" />

    
    <use href="#all-notes" fill="url(#chrome-metal)" stroke="url(#chrome-rim)" stroke-width="1.5" stroke-linejoin="round" />
    
  </g>
</svg>